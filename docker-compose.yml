services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: taphtml_postgres
    environment:
      - POSTGRES_DB=taphtml_db
      - POSTGRES_USER=taphtml_user
      - POSTGRES_PASSWORD=taphtml_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taphtml_user -d taphtml_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: taphtml_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # 3. API
  api:
    build: ./api
    container_name: taphtml_api
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    environment:
      - DB_HOST=taphtml_postgres
      - DB_NAME=taphtml_db
      - DB_USER=taphtml_user
      - DB_PASS=taphtml_password
      - REDIS_HOST=taphtml_redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 4. Dashboard
  dashboard:
    build: ./dashboard
    container_name: taphtml_dashboard
    ports:
      - "5173:5173"
    env_file:
      - ./dashboard/.env
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 5. Extension
  extension:
    build: ./extension
    container_name: taphtml_extension
    ports:
      - "5174:5174"
    env_file:
      - ./extension/.env
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5174 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 6. Widget
  widget:
    build: ./widget
    container_name: taphtml_widget
    ports:
      - "5175:5175"
    env_file:
      - ./widget/.env
    depends_on:
      extension:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5175 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8::/64

volumes:
  pgdata: